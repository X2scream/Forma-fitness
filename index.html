<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><div class="mark">F</div><div><div class="brandword">FORMA</div><small>YOUR FITNESS TRACKER</small></div></div>
      <div><div class="sidecaption">WORKSPACE</div><nav id="desktop-nav" class="nav" aria-label="เมนูหลัก"></nav></div>
      <div class="sidebottom"><div class="sbhead">✦ ONE DAY AT A TIME</div><p>ทุกวันที่ได้ลงมือทำ คือความก้าวหน้า ไม่ต้องสมบูรณ์แบบทุกวัน</p></div>
    </aside>
    <main class="workspace"><div id="topbar"></div><div id="content"></div><div class="footer">FORMA • ข้อมูลบันทึกไว้ในเบราว์เซอร์นี้ • สำรองข้อมูลเป็นประจำ</div></main>
  </div>
  <nav class="mobilebar" id="mobile-nav" aria-label="เมนูมือถือ"></nav>
  <div id="modal-root"></div><div id="toast-root" role="status" aria-live="polite"></div>
  <input type="file" accept="application/json,.json" id="import-file" hidden>
  <script>
  'use strict';
  const KEY='forma_fitness_tracker_v1';
  const menus=[['dashboard','▦','ภาพรวม'],['schedule','☑','ตารางฝึก'],['nutrition','◉','อาหาร / น้ำ'],['progress','▥','ความคืบหน้า']];
  const DAY_NAMES=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  const SHORT_DAYS=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad=v=>String(v).padStart(2,'0');
  function localISO(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
  function parseDate(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
  function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return localISO(d)}
  function dateDiff(a,b){return Math.round((parseDate(b)-parseDate(a))/86400000)}
  function dayLabel(s,options){return parseDate(s).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',...(options||{})})}
  function nfmt(n,d=0){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:d,minimumFractionDigits:d})}
  function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}
  function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
  function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
  const today=localISO();
  const initial=()=>({version:1,settings:{startWeight:86,goalWeight:75,calorieGoal:2250,proteinGoal:160,waterGoal:2500,startDate:today},days:{},weights:{}});
  function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.settings&&typeof x.days==='object'&&typeof x.weights==='object'){return normalize(x)}}catch(e){}return initial()}
  function normalize(x){const s={...initial().settings,...(x.settings||{})};return {version:1,settings:s,days:x.days||{},weights:x.weights||{}}}
  let data=load();let selected=today;let view='dashboard';let showSettings=false;let toastTimer;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(err){toast('ไม่สามารถบันทึกในเบราว์เซอร์นี้ได้ กรุณาเปิดเว็บผ่าน HTTPS','error');return false}}
  function toast(message,kind='ok'){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast ${kind==='error'?'error':''}">${safe(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3400)}
  function getDay(date=selected){return data.days[date]||{checks:{},foods:[],water:0,energy:0,note:'',custom:[]}}
  function mutateDay(date,fn){let x=structuredClone(getDay(date));x.checks=x.checks||{};x.foods=x.foods||[];x.custom=x.custom||[];fn(x);data.days[date]=x;save();render()}
  function baseSchedule(date){const d=parseDate(date).getDay();const all={
    0:{rest:true,tag:'วันพักฟื้น',name:'พักร่างกาย',desc:'ให้ร่างกายได้ฟื้นตัวและเตรียมสัปดาห์ใหม่',am:['พักหรือเดินสบาย ๆ','ไม่บังคับ เดินผ่อนคลายได้ตามต้องการ','ตามสบาย'],pm:['ยืดเหยียดเบา ๆ และพักผ่อน','ให้ความสำคัญกับการนอน','10–15 นาที']},
    1:{tag:'Strength day',name:'Calisthenics A',desc:'ฝึกทั้งตัว • อก หลัง ขา แกนกลาง',am:['เดินเร็ว','รักษาจังหวะที่ยังพูดได้','25–30 นาที'],pm:['Calisthenics A','ฝึก 5 ท่าตามโปรแกรม + วอร์มอัป','45–55 นาที'],workout:'A'},
    2:{tag:'Cardio day',name:'Easy Run',desc:'คาร์ดิโอเบา ๆ ไม่เน้นทำความเร็ว',am:['เดินเร็ว','เดินก่อนเริ่มทำงาน','20–30 นาที'],pm:['วิ่งเบา / สลับเดิน','วิ่งในระดับที่ยังพูดเป็นประโยคได้','30–35 นาที']},
    3:{tag:'Strength day',name:'Calisthenics B',desc:'ฝึกทั้งตัว • ไหล่ หลัง ขา หน้าท้อง',am:['เดินเร็ว','เพิ่มการเคลื่อนไหวก่อนนั่งทำงาน','25–30 นาที'],pm:['Calisthenics B','ฝึก 5 ท่าตามโปรแกรม + วอร์มอัป','45–55 นาที'],workout:'B'},
    4:{rest:true,tag:'วันพักฟื้น',name:'Recovery Day',desc:'ไม่จำเป็นต้องออกกำลังกายเพิ่ม',am:['พักฟื้นร่างกาย','เดินสบายหากอยากขยับตัว','ตามสบาย'],pm:['เตรียมตัวเข้านอนให้เพียงพอ','พยายามนอนประมาณ 8–9 ชั่วโมง','พักผ่อน']},
    5:{tag:'Strength day',name:'Calisthenics C',desc:'ฝึกทั้งตัว • คงความแข็งแรงของกล้ามเนื้อ',am:['เดินเร็ว','รักษาจังหวะสบาย ๆ','25–30 นาที'],pm:['Calisthenics C','ฝึก 5 ท่าตามโปรแกรม + วอร์มอัป','45–55 นาที'],workout:'C'},
    6:{tag:'Cardio day',name:'Cardio + Battle Rope',desc:'เน้นความอึด จบสัปดาห์โดยไม่ฝืนร่างกาย',am:['เดินสบาย หรือพัก','เลือกตามความล้าของร่างกาย','ตามสบาย'],pm:['วิ่งเบา / เดินเร็ว + Battle Rope','คาร์ดิโอ 35–45 นาที; Rope 6×20 วิ. ถ้ายังมีแรง','40–50 นาที']}
  };return all[d]}
  const EXERCISES={A:[['Push-up','3 × 8–15 ครั้ง'],['Goblet Squat','3 × 12–20 ครั้ง'],['Dumbbell Row','3 × 12–20 ครั้ง/ข้าง'],['Dumbbell RDL','3 × 12–20 ครั้ง'],['Plank','3 × 30–45 วินาที']],B:[['Pike Push-up','3 × 6–12 ครั้ง'],['Reverse Lunge','3 × 10 ครั้ง/ข้าง'],['Dumbbell Row','3 × 12–20 ครั้ง/ข้าง'],['Glute Bridge','3 × 15–20 ครั้ง'],['Side Plank','3 × 30 วิ./ข้าง']],C:[['Close-grip Push-up','3 × 6–12 ครั้ง'],['Split Squat','3 × 10 ครั้ง/ข้าง'],['Dumbbell Row','3 × 12–20 ครั้ง/ข้าง'],['Single-leg RDL','3 × 10 ครั้ง/ข้าง'],['Dead Bug','3 × 10 ครั้ง/ข้าง']]};
  function endDate(){const d=parseDate(data.settings.startDate);d.setMonth(d.getMonth()+4);return localISO(d)}
  function planTarget(date){const s=data.settings,t=dateDiff(s.startDate,date),length=Math.max(1,dateDiff(s.startDate,endDate()));const k=clamp(t/length,0,1);const marks=[0,1/4,2/4,3/4,1],frac=[0,3.5/11,6/11,8.5/11,1];let f=0;for(let i=0;i<4;i++){if(k>=marks[i]&&k<=marks[i+1]){f=frac[i]+(frac[i+1]-frac[i])*(k-marks[i])/(marks[i+1]-marks[i]);break}}if(k>=1)f=1;return s.startWeight-(s.startWeight-s.goalWeight)*f}
  function weightEntries(){return Object.entries(data.weights).filter(([date,v])=>/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number(v)>0).sort((a,b)=>a[0].localeCompare(b[0]))}
  function latestWeight(){const entries=weightEntries().filter(([dt])=>dt<=selected);return entries.length?Number(entries.at(-1)[1]):null}
  function recentWeight(){const entries=weightEntries();return entries.length?{date:entries.at(-1)[0],weight:Number(entries.at(-1)[1])}:null}
  function weekStart(date){let offset=(parseDate(date).getDay()+6)%7;return addDays(date,-offset)}
  function weekDates(date){const first=weekStart(date);return Array.from({length:7},(_,i)=>addDays(first,i))}
  function doneTrain(date){return !baseSchedule(date).rest&&!!getDay(date).checks?.pm}
  function workoutsThisWeek(date){return weekDates(date).filter(doneTrain).length}
  function getCalories(date=selected){return (getDay(date).foods||[]).reduce((sum,food)=>sum+(Number(food.calories)||0),0)}
  function getProtein(date=selected){return (getDay(date).foods||[]).reduce((sum,food)=>sum+(Number(food.protein)||0),0)}
  function getWater(date=selected){return Number(getDay(date).water)||0}
  function changeView(next){view=next;showSettings=false;render();window.scrollTo({top:0,behavior:'smooth'})}
  function navMarkup(){return menus.map(([id,ico,name])=>`<button class="navbtn ${view===id?'active':''}" data-action="view" data-view="${id}" aria-current="${view===id?'page':'false'}"><span class="navico">${ico}</span><span>${name}</span></button>`).join('')}
  function topbar(){let name={dashboard:'ภาพรวมของคุณ',schedule:'ตารางออกกำลังกาย',nutrition:'อาหารและน้ำดื่ม',progress:'รายงานความคืบหน้า'}[view];return `<div class="topbar"><div><div class="eyebrow">PERSONAL FITNESS SPACE</div><h1 class="page-title">${name}</h1><p class="subtitle">${dayLabel(selected,{weekday:'long'})} · บันทึกก้าวเล็ก ๆ ของคุณทุกวัน</p></div><div class="top-right"><div class="datebar"><button class="btn ghost sm" data-action="prev-date" title="วันก่อนหน้า" aria-label="วันก่อนหน้า">‹</button><input id="select-date" type="date" value="${selected}" aria-label="เลือกวันที่"><button class="btn ghost sm" data-action="next-date" title="วันถัดไป" aria-label="วันถัดไป">›</button><button class="btn sm" data-action="today">วันนี้</button></div><button class="btn sm" data-action="settings" title="ตั้งค่า">⚙ ตั้งค่า</button></div></div>`}
  function stat(label,icon,val,unit,desc,accent=''){return `<div class="stat"><div class="statlabel"><span class="staticon">${icon}</span>${label}</div><div class="statvalue ${accent}">${val}<span class="statunit">${unit||''}</span></div><div class="statdesc">${desc}</div></div>`}
  function weekPicker(){return `<div class="weekgrid">${weekDates(selected).map(date=>{const s=baseSchedule(date),done=doneTrain(date);return `<button class="weekday ${date===selected?'selected':''} ${date===today?'today':''} ${done?'done':''} ${s.rest?'rest':''}" data-action="jump-date" data-date="${date}" aria-label="${dayLabel(date,{weekday:'long'})}"><div class="week-day-label">${SHORT_DAYS[parseDate(date).getDay()]}</div><div class="week-num">${parseDate(date).getDate()}</div><div class="week-dot"></div></button>`}).join('')}</div>`}
  function miniTask(date,key,task){const checked=!!getDay(date).checks?.[key];return `<div class="daily-task"><button class="check ${checked?'checked':''}" data-action="check" data-key="${key}" aria-label="${checked?'ยกเลิก':'ทำเสร็จ'} ${safe(task[0])}" aria-pressed="${checked}">${checked?'✓':''}</button><div style="flex:1;min-width:0"><div class="taskname ${checked?'checked':''}">${safe(task[0])}</div><div class="taskdesc">${safe(task[1])}</div></div><span class="timepill">${safe(task[2])}</span></div>`}
  function progressBar(value,goal,color='var(--lime)'){return `<div class="progressline"><div style="width:${pct(value,goal)}%;background:${color}"></div></div>`}
  function waterCard(){const water=getWater(),goal=data.settings.waterGoal;return `<section class="panel"><div class="row"><div><div class="panel-title">💧 ดื่มน้ำวันนี้</div><div class="panel-sub">เพิ่มจำนวนได้ทุกครั้งที่ดื่ม</div></div><span class="chip">เป้า ${nfmt(goal)} ml</span></div><div class="watertop"><div><div class="metricbig blue">${nfmt(water)} <span>ml</span></div><div class="small muted">${water>=goal?'ถึงเป้าหมายแล้ว ✓':`เหลืออีก ${nfmt(goal-water)} ml`}</div></div><span class="watericon" aria-hidden="true">💦</span></div>${progressBar(water,goal,'linear-gradient(90deg,#617bfc,#7fe5f6)')}<div class="waterdrops" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="waterdrop ${pct(water,goal)>i*10?'full':''}"></i>`).join('')}</div><div class="quickrow"><button class="btn sm" data-action="water" data-delta="-250" aria-label="ลดน้ำ 250 มิลลิลิตร">−250</button><button class="btn sm soft" data-action="water" data-delta="250">+250 ml</button><button class="btn sm soft" data-action="water" data-delta="500">+500 ml</button></div><form id="custom-water" class="smallform"><input class="field" name="amount" type="number" inputmode="numeric" min="1" max="10000" placeholder="จำนวน ml ที่ดื่ม" required><button class="btn sm" type="submit">เพิ่มน้ำ</button></form></section>`}
  function calCard(){const cal=getCalories(),goal=data.settings.calorieGoal,protein=getProtein(),pgoal=data.settings.proteinGoal;return `<section class="panel"><div class="row"><div><div class="panel-title">⚡ พลังงานจากอาหาร</div><div class="panel-sub">นับแคลอรีที่บันทึกวันนี้</div></div><span class="chip">เป้า ~${nfmt(goal)} kcal</span></div><div class="cal-summary" style="margin-top:14px"><div class="ring" style="--p:${pct(cal,goal)}%"><div class="ringcontent"><b>${nfmt(cal)}</b><small>kcal ที่บันทึก</small></div></div><div style="flex:1;min-width:0"><div class="small muted">${cal>goal?'สูงกว่าเป้าโดยประมาณ':'เหลือจากเป้าโดยประมาณ'}</div><div class="metricbig" style="margin:2px 0">${nfmt(Math.abs(goal-cal))} <span>kcal</span></div><div class="small muted">โปรตีน ${nfmt(protein,1)} / ${nfmt(pgoal)} g</div>${progressBar(protein,pgoal,'var(--mint)')}</div></div><div class="row" style="margin-top:16px"><span class="small muted">${(getDay().foods||[]).length} รายการที่บันทึก</span><button class="btn sm soft" data-action="view" data-view="nutrition">+ เพิ่มอาหาร</button></div><div class="sechelp">เป็นบันทึกพลังงานที่กิน ไม่ใช่พลังงานที่เผาผลาญ</div></section>`}
  function energyCard(){const energy=Number(getDay().energy)||0;return `<section class="panel"><div class="row"><div><div class="panel-title">🔋 ระดับพลังงานร่างกาย</div><div class="panel-sub">วันนี้รู้สึกมีแรงแค่ไหน?</div></div><span class="chip">${energy?energy+'/5':'ยังไม่ประเมิน'}</span></div><div class="energyrow">${[1,2,3,4,5].map(i=>`<button class="energybtn ${energy===i?'on':''}" data-action="energy" data-value="${i}" aria-pressed="${energy===i}">${i}</button>`).join('')}</div><div class="energylabels"><span>อ่อนล้า</span><span>มีแรงมาก</span></div></section>`}
  function dashboard(){const s=baseSchedule(selected),w=latestWeight(),down=w==null?0:data.settings.startWeight-w,total=data.settings.startWeight-data.settings.goalWeight,daysdone=workoutsThisWeek(selected);return `<section class="hero"><div><div class="eyebrow">YOUR 4-MONTH JOURNEY · ${s.rest?'REST DAY':'WORKOUT DAY'}</div><h2>${s.rest?'พักให้ดี เพื่อกลับมาแข็งแรงกว่าเดิม':'วันนี้คืออีกหนึ่งก้าวไปสู่เป้าหมาย'}</h2><p>จาก ${nfmt(data.settings.startWeight,1)} สู่ ${nfmt(data.settings.goalWeight,1)} กก. · แผนฝึก 5 วัน/สัปดาห์ · เน้นลดไขมันและรักษากล้ามเนื้อ</p></div><div class="herocircle" style="--progress:${pct(down,total)}%"><div class="herocircletxt"><strong>${Math.round(pct(down,total))}%</strong><small>สู่เป้าหมาย</small></div></div></section>
  <div class="stats">${stat('น้ำหนักล่าสุด','⚖️',nfmt(w??data.settings.startWeight,1),'kg',w==null?'น้ำหนักตั้งต้น (ยังไม่บันทึกจริง)':`จากบันทึกถึงวันที่ ${dayLabel(selected)}`)}${stat('ลดลงจากเริ่มต้น','↘',w==null?'—':nfmt(down,1),'kg',w==null?'เพิ่มน้ำหนักในหน้าความคืบหน้า':`เหลือ ${nfmt(Math.max(0,(w??0)-data.settings.goalWeight),1)} กก. ถึงเป้า`,down>0?'green':'')}${stat('ออกกำลังสัปดาห์นี้','🔥',String(daysdone),'/ 5 วัน','นับจากการทำกิจกรรมช่วงเย็น')}${stat('เป้าหมายน้ำหนัก','◎',nfmt(data.settings.goalWeight,1),'kg','ภายใน 4 เดือน (ปรับได้)')}</div>
  <div class="sectionhead"><h2>บันทึกประจำวัน</h2><span class="small muted">${DAY_NAMES[parseDate(selected).getDay()]} · ${dayLabel(selected)}</span></div><div class="grid2">${waterCard()}${calCard()}</div>

  <div class="sectionhead"><h2>ภาพรวมสัปดาห์</h2><span class="small muted">แตะวันที่เพื่อเปลี่ยนวันบันทึก</span></div><section class="panel"><div class="row"><strong>ออกกำลังกายแล้ว ${daysdone} จาก 5 วัน</strong><span class="chip ${daysdone>=5?'greenchip':''}">${Math.round(daysdone/5*100)}%</span></div>${progressBar(daysdone,5)}${weekPicker()}<div class="small muted">จุดสีเขียว = ฝึกช่วงเย็นเสร็จ · จุดสีม่วง = วันพัก · ตารางจันทร์ถึงอาทิตย์</div></section>`}
  function schedulePage(){let s=baseSchedule(selected),done=getDay().checks||{},extras=getDay().custom||[],total=[done.am,done.pm,...extras.map(e=>done[e.id])].filter(Boolean).length,count=2+extras.length;return `<section class="panel"><div class="row"><div><div class="panel-title">เลือกวันในสัปดาห์</div><div class="panel-sub">ตารางฝึกจันทร์–เสาร์ พักวันพฤหัสและอาทิตย์</div></div><span class="chip ${s.rest?'rest':'greenchip'}">${s.rest?'พักฟื้น':'วันฝึก'}</span></div>${weekPicker()}</section><section class="panel" style="margin-top:17px"><div class="row"><div><div class="eyebrow">DAILY CHECKLIST</div><h2 style="margin:7px 0 2px;font-size:24px">${s.name}</h2><div class="small muted">${s.desc}</div></div><span class="chip greenchip">${total}/${count} ทำแล้ว</span></div>${progressBar(total,count)}<div class="sectionhead" style="margin-top:22px"><h2>☀️ ช่วงเช้า</h2><span class="small muted">ก่อนทำงาน / เรียน</span></div>${miniTask(selected,'am',s.am)}<div class="sectionhead"><h2>🌙 ช่วงเย็น</h2><span class="small muted">หลังทำงาน / เรียน</span></div>${miniTask(selected,'pm',s.pm)}${s.rest?'<div class="notice">วันพักไม่ถูกนับเป็นหนึ่งใน 5 วันออกกำลังกาย หากต้องการพักเต็มวันก็ทำได้</div>':`<div class="notice">${s.workout?'วอร์มอัป 5–8 นาที • พักระหว่างเซต 60–120 วินาที • เลือกความยากโดยเหลือแรงประมาณ 1–3 ครั้ง':'วิ่งหรือเดินที่ระดับยังพูดเป็นประโยคได้ ถ้าล้าสามารถลดความหนักได้'}</div>`}${s.workout?`<div class="sectionhead"><h2>รายการท่า Workout ${s.workout}</h2><span class="small muted">ฝึกตามกำลังจริง</span></div><div class="workoutlist">${EXERCISES[s.workout].map((x,i)=>`<div class="workoutitem"><b>${i+1}. ${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>`:''}<div class="sectionhead"><h2>เช็กลิสต์เพิ่มเติม</h2><span class="small muted">เพิ่มรายการของตัวเองได้</span></div>${extras.map((x)=>`<div class="daily-task"><button class="check ${done[x.id]?'checked':''}" data-action="check" data-key="${safe(x.id)}" aria-label="ทำเสร็จ ${safe(x.name)}">${done[x.id]?'✓':''}</button><div class="taskname ${done[x.id]?'checked':''}" style="flex:1">${safe(x.name)}</div><button class="taskdel" data-action="delete-task" data-id="${safe(x.id)}" aria-label="ลบรายการ">×</button></div>`).join('')}<form id="add-task" class="taskmore"><input class="field" name="task" maxlength="90" placeholder="เช่น ยืดเหยียด, เตรียมอาหารมื้อพรุ่งนี้" required><button class="btn soft" type="submit">+ เพิ่มรายการ</button></form></section><section class="panel" style="margin-top:17px"><div class="panel-title">บันทึกสั้น ๆ ประจำวัน</div><p class="panel-sub">วันนี้ฝึกเป็นอย่างไร ปวดเมื่อยหรือมีอะไรอยากจำไว้?</p><form id="save-note"><textarea class="field note" name="note" maxlength="2500" placeholder="จดสิ่งที่อยากติดตาม...">${safe(getDay().note||'')}</textarea><div class="row" style="margin-top:10px"><span class="small muted">บันทึกแยกตามวันที่</span><button class="btn sm soft" type="submit">บันทึกโน้ต</button></div></form></section>`}
  function nutritionPage(){const cal=getCalories(),protein=getProtein(),foods=getDay().foods||[];return `<div class="grid2">${calCard()}${waterCard()}</div><div class="sectionhead"><h2>เพิ่มอาหาร / เครื่องดื่ม</h2><span class="small muted">เก็บตามวันที่เลือก</span></div><section class="panel"><form id="food-form" class="formgrid"><div class="foodnamelabel"><label class="fieldlabel" for="food-name">ชื่ออาหาร</label><input class="field" id="food-name" name="name" placeholder="เช่น ข้าวไก่ย่าง" maxlength="100" required></div><div><label class="fieldlabel" for="food-cal">พลังงาน (kcal)</label><input class="field" id="food-cal" name="calories" type="number" min="0" max="10000" step="1" inputmode="decimal" placeholder="450" required></div><div><label class="fieldlabel" for="food-pro">โปรตีน (g)</label><input class="field" id="food-pro" name="protein" type="number" min="0" max="500" step="0.1" inputmode="decimal" placeholder="30"></div><div class="formbutton"><button class="btn primary" type="submit">+ เพิ่ม</button></div></form><p class="sechelp">กรอกค่าจากฉลากหรือประมาณจากอาหารที่กินจริง หากไม่รู้โปรตีนให้เว้นว่างได้</p><div class="mutedborder"></div><div class="row"><div class="panel-title">รายการอาหาร · ${dayLabel(selected)}</div><span class="chip">${foods.length} รายการ</span></div>${foods.length?foods.slice().reverse().map(f=>`<div class="foodrow"><div><div class="foodname">${safe(f.name)}</div><div class="mini">บันทึก ${safe(f.time||'')}</div></div><div class="calitem">${nfmt(f.calories)} kcal</div><div class="calitem protein">${nfmt(f.protein||0,1)}g P</div><button class="taskdel" data-action="delete-food" data-id="${safe(f.id)}" aria-label="ลบอาหาร ${safe(f.name)}">×</button></div>`).join(''):'<div class="empty">ยังไม่มีรายการอาหารวันนี้<br>เพิ่มมื้ออาหารแรกเพื่อเริ่มบันทึก</div>'}<div class="mutedborder"></div><div class="row"><strong>รวมที่บันทึก</strong><div><strong>${nfmt(cal)} kcal</strong><span class="small muted"> / โปรตีน ${nfmt(protein,1)} g</span></div></div></section><div class="sectionhead"><h2>ฟังสัญญาณร่างกาย</h2></div>${energyCard()}<p class="sechelp">ตัวเลขแคลอรีเป็นค่าเป้าหมายโดยประมาณ ไม่จำเป็นต้องกินต่ำกว่าเป้าทุกวัน หากอ่อนล้าต่อเนื่อง ควรทบทวนการพักผ่อนและอาหาร</p>`}
  function lineChart(){const records=weightEntries(),s=data.settings;const end=endDate(),start=s.startDate,dates=[start,end,...records.map(r=>r[0])].sort();const first=dates[0],last=dates.at(-1),span=Math.max(1,dateDiff(first,last));const nums=[s.startWeight,s.goalWeight,...records.map(x=>Number(x[1]))];const minV=Math.floor(Math.min(...nums)-2),maxV=Math.ceil(Math.max(...nums)+2),range=Math.max(1,maxV-minV),W=850,H=305,left=47,right=25,top=20,bottom=39;
    const X=date=>left+dateDiff(first,date)/span*(W-left-right),Y=value=>top+(maxV-value)/range*(H-top-bottom);let grid='';for(let i=0;i<=4;i++){const v=minV+range*i/4,y=Y(v);grid+=`<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" stroke="#33405a" stroke-dasharray="3,6"/><text x="${left-10}" y="${y+4}" fill="#8d9ab3" font-size="12" text-anchor="end">${v.toFixed(1)}</text>`}let xLabels='';for(let i=0;i<=4;i++){const date=addDays(first,Math.round(span*i/4));xLabels+=`<text x="${X(date)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#8d9ab3">${safe(parseDate(date).toLocaleDateString('th-TH',{day:'numeric',month:'short'}))}</text>`}
    const targetPts=[0,.25,.5,.75,1].map(t=>{const date=addDays(start,Math.round(dateDiff(start,end)*t));return `${X(date)},${Y(planTarget(date))}`}).join(' ');
    const actualPts=records.map(([date,weight])=>`${X(date)},${Y(Number(weight))}`).join(' ');
    const dots=records.map(([date,weight])=>`<circle cx="${X(date)}" cy="${Y(Number(weight))}" r="5" fill="#b9f46e" stroke="#1e3041" stroke-width="3"><title>${safe(dayLabel(date))}: ${weight} kg</title></circle>`).join('');
    return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟน้ำหนักที่บันทึกจริงและเส้นเป้าหมายรายเดือน">${grid}${xLabels}<polyline points="${targetPts}" fill="none" stroke="#88aaff" stroke-width="2.5" stroke-dasharray="8,8"/>${records.length>1?`<polyline points="${actualPts}" fill="none" stroke="#b9f46e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:''}${dots}</svg></div><div class="legend"><span><i></i> น้ำหนักที่บันทึก</span><span><i class="dashed"></i> แนวเป้าหมาย 4 เดือน</span></div>`}
  function bars7(){const dates=Array.from({length:7},(_,i)=>addDays(selected,i-6));const goal=data.settings.calorieGoal,max=Math.max(goal*1.2,...dates.map(d=>getCalories(d)),1);return `<div class="bars">${dates.map(d=>{const foods=getDay(d).foods||[],v=getCalories(d),h=foods.length?Math.max(4,v/max*116):3;return `<div class="barcol"><div class="barvalue">${foods.length?nfmt(v):'—'}</div><div class="bar ${foods.length?'':'missing'}" style="height:${h}px" title="${safe(dayLabel(d))}: ${nfmt(v)} kcal"></div></div>`}).join('')}</div><div class="barfoot">${dates.map(d=>`<div class="barlabel">${SHORT_DAYS[parseDate(d).getDay()]}<br>${parseDate(d).getDate()}</div>`).join('')}</div>`}
  function progressPage(){const newest=recentWeight(),down=newest?data.settings.startWeight-newest.weight:null,entries=weightEntries().slice().reverse();const dates=Array.from({length:7},(_,i)=>addDays(selected,-i));const dayswithfood=dates.filter(d=>(getDay(d).foods||[]).length>0),dayswater=dates.filter(d=>getWater(d)>0);const avgC=dayswithfood.length?dayswithfood.reduce((n,d)=>n+getCalories(d),0)/dayswithfood.length:null,avgW=dayswater.length?dayswater.reduce((n,d)=>n+getWater(d),0)/dayswater.length:null;return `<div class="stats" style="margin-top:0">${stat('น้ำหนักที่บันทึกล่าสุด','⚖️',newest?nfmt(newest.weight,1):'—','kg',newest?dayLabel(newest.date):'ยังไม่ได้บันทึก')}${stat('เปลี่ยนจากเริ่มต้น','↘',down==null?'—':(down>=0?'-':'+')+nfmt(Math.abs(down||0),1),'kg',down==null?'รอการบันทึก':down>0?'น้ำหนักลดลง':'ติดตามแนวโน้มต่อไป',down>0?'green':'')}${stat('เฉลี่ยแคลอรี 7 วัน','⚡',avgC==null?'—':nfmt(avgC),'kcal','เฉพาะวันที่บันทึกอาหาร')}${stat('เฉลี่ยน้ำ 7 วัน','💧',avgW==null?'—':nfmt(avgW),'ml','เฉพาะวันที่บันทึกน้ำ')}</div>
  <div class="sectionhead"><h2>บันทึกน้ำหนัก</h2><span class="small muted">เลือกวันที่จากด้านบนได้</span></div><section class="panel"><form id="weight-form" class="f-row" style="align-items:end"><div><label class="fieldlabel" for="weight-date">วันที่ชั่งน้ำหนัก</label><input class="field" type="date" name="date" id="weight-date" value="${selected}" required></div><div><label class="fieldlabel" for="weight-number">น้ำหนัก (กิโลกรัม)</label><input class="field" type="number" id="weight-number" name="weight" min="20" max="350" step="0.1" inputmode="decimal" placeholder="เช่น 85.2" value="${data.weights[selected]??''}" required></div><button type="submit" class="btn primary">บันทึกน้ำหนัก</button></form><p class="sechelp">ชั่งหลังตื่นนอนและเข้าห้องน้ำแล้ว การขึ้นลงระหว่างวันเป็นเรื่องปกติ ให้ดูค่าเฉลี่ยหลายวัน</p></section>
  <div class="sectionhead"><h2>กราฟน้ำหนักตลอดแผน</h2><span class="chip greenchip">เป้าหมาย ${nfmt(data.settings.goalWeight,1)} kg</span></div><section class="panel"><div class="row"><div><div class="panel-title">Weight Progress</div><div class="panel-sub">เริ่มแผน ${dayLabel(data.settings.startDate)} · สิ้นสุด ${dayLabel(endDate())}</div></div><span class="chip">${weightEntries().length} บันทึก</span></div>${lineChart()}${entries.length?'':'<div class="empty">ยังไม่มีจุดน้ำหนักจริงในกราฟ บันทึกครั้งแรกด้านบนได้เลย</div>'}</section>
  <div class="sectionhead"><h2>พลังงานจากอาหาร · 7 วันล่าสุด</h2></div><section class="panel"><div class="row"><div class="panel-title">แคลอรีที่บันทึกแต่ละวัน</div><span class="chip">เป้า ~${nfmt(data.settings.calorieGoal)} kcal</span></div>${bars7()}<p class="sechelp">วันไม่มีข้อมูลจะแสดง — ไม่ได้แปลว่ากิน 0 kcal</p></section>
  <div class="sectionhead"><h2>ประวัติน้ำหนัก</h2></div><section class="panel" style="overflow-x:auto"><table class="historytable"><thead><tr><th>วันที่</th><th>น้ำหนัก</th><th>เทียบกับเริ่มต้น</th><th></th></tr></thead><tbody>${entries.length?entries.map(([date,w])=>`<tr><td>${dayLabel(date)}</td><td><strong>${nfmt(w,1)} kg</strong></td><td class="${Number(w)<data.settings.startWeight?'green':''}">${Number(w)===data.settings.startWeight?'—':(Number(w)<data.settings.startWeight?'-':'+')+nfmt(Math.abs(data.settings.startWeight-Number(w)),1)+' kg'}</td><td style="text-align:right"><button class="btn sm danger" data-action="delete-weight" data-date="${date}">ลบ</button></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">ยังไม่มีการบันทึกน้ำหนัก</div></td></tr>'}</tbody></table></section>`}
  function settingsModal(){if(!showSettings){document.getElementById('modal-root').innerHTML='';return}const s=data.settings;document.getElementById('modal-root').innerHTML=`<div class="modalbg" id="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-label="ตั้งค่าเป้าหมาย"><div class="row"><div><div class="eyebrow">YOUR PERSONAL GOALS</div><h2 style="margin:4px 0 0">ตั้งค่าเป้าหมาย</h2></div><button class="btn sm" data-action="close-settings">✕</button></div><form id="settings-form" style="margin-top:22px"><div class="settingsgrid"><div><label class="fieldlabel">น้ำหนักเริ่มต้น (kg)</label><input name="startWeight" class="field" type="number" min="25" max="350" step="0.1" value="${s.startWeight}" required></div><div><label class="fieldlabel">น้ำหนักเป้าหมาย (kg)</label><input name="goalWeight" class="field" type="number" min="25" max="350" step="0.1" value="${s.goalWeight}" required></div><div><label class="fieldlabel">พลังงานต่อวัน (kcal)</label><input name="calorieGoal" class="field" type="number" min="1200" max="9000" step="10" value="${s.calorieGoal}" required></div><div><label class="fieldlabel">โปรตีนต่อวัน (g)</label><input name="proteinGoal" class="field" type="number" min="30" max="350" step="5" value="${s.proteinGoal}" required></div><div><label class="fieldlabel">เป้าหมายน้ำ (ml)</label><input name="waterGoal" class="field" type="number" min="250" max="10000" step="50" value="${s.waterGoal}" required></div><div><label class="fieldlabel">วันเริ่มแผน 4 เดือน</label><input name="startDate" class="field" type="date" value="${s.startDate}" required></div></div><p class="notice" style="margin-top:16px">ตัวเลขแคลอรีและน้ำเป็นเพียงเป้าหมายเบื้องต้น ปรับตามการใช้พลังงาน ความหิว กิจกรรม และความเหมาะสมกับสุขภาพ การลดน้ำหนักไม่จำเป็นต้องเร็วทุกสัปดาห์</p><button class="btn primary" style="width:100%;margin-top:15px" type="submit">บันทึกเป้าหมาย</button></form><div class="mutedborder"></div><div class="panel-title">สำรองและย้ายข้อมูล</div><p class="panel-sub">ข้อมูลเก็บในเบราว์เซอร์นี้ ไม่ซิงก์ข้ามอุปกรณ์ หากล้างข้อมูลเว็บไซต์อาจสูญหาย</p><div class="f-row" style="margin-top:13px"><button class="btn sm" data-action="export">↓ ส่งออก JSON</button><button class="btn sm" data-action="import">↑ นำเข้า JSON</button></div></div></div>`}
  function render(){document.getElementById('desktop-nav').innerHTML=navMarkup();document.getElementById('mobile-nav').innerHTML=navMarkup();document.getElementById('topbar').innerHTML=topbar();document.getElementById('content').innerHTML=({dashboard,schedule:schedulePage,nutrition:nutritionPage,progress:progressPage})[view]();settingsModal()}
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn){if(e.target.id==='modal-bg'){showSettings=false;settingsModal()}return}const action=btn.dataset.action;
    if(action==='view'){changeView(btn.dataset.view);return}
    if(action==='prev-date'){selected=addDays(selected,-1);render();return}
    if(action==='next-date'){selected=addDays(selected,1);render();return}
    if(action==='today'){selected=localISO();render();return}
    if(action==='jump-date'){selected=btn.dataset.date;render();return}
    if(action==='settings'){showSettings=true;settingsModal();return}
    if(action==='close-settings'){showSettings=false;settingsModal();return}
    if(action==='check'){const key=btn.dataset.key;mutateDay(selected,d=>{d.checks[key]=!d.checks[key]});return}
    if(action==='water'){const delta=Number(btn.dataset.delta);mutateDay(selected,d=>{d.water=clamp((Number(d.water)||0)+delta,0,30000)});return}
    if(action==='energy'){const value=Number(btn.dataset.value);mutateDay(selected,d=>{d.energy=d.energy===value?0:value});return}
    if(action==='delete-food'){if(!confirm('ลบรายการอาหารนี้?'))return;mutateDay(selected,d=>{d.foods=d.foods.filter(f=>f.id!==btn.dataset.id)});toast('ลบรายการแล้ว');return}
    if(action==='delete-task'){mutateDay(selected,d=>{d.custom=d.custom.filter(x=>x.id!==btn.dataset.id);delete d.checks[btn.dataset.id]});return}
    if(action==='delete-weight'){if(!confirm(`ลบบันทึกน้ำหนักวันที่ ${dayLabel(btn.dataset.date)}?`))return;delete data.weights[btn.dataset.date];save();render();toast('ลบบันทึกน้ำหนักแล้ว');return}
    if(action==='export'){exportData();return}
    if(action==='import'){document.getElementById('import-file').click();return}
  });
  document.addEventListener('change',e=>{if(e.target.id==='select-date'&&/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){selected=e.target.value;render()}});
  document.addEventListener('submit',e=>{const f=e.target;if(!['custom-water','food-form','weight-form','add-task','save-note','settings-form'].includes(f.id))return;e.preventDefault();const v=Object.fromEntries(new FormData(f).entries());
    if(f.id==='custom-water'){const amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0||amount>10000){toast('กรุณากรอกจำนวน 1–10,000 ml','error');return}mutateDay(selected,d=>d.water=clamp((Number(d.water)||0)+amount,0,30000));return}
    if(f.id==='food-form'){const kcal=Number(v.calories),pro=Number(v.protein||0);if(!v.name.trim()||!Number.isFinite(kcal)||kcal<0||kcal>10000||!Number.isFinite(pro)||pro<0||pro>500){toast('ตรวจสอบตัวเลขอาหารอีกครั้ง','error');return}mutateDay(selected,d=>{d.foods.push({id:uid(),name:v.name.trim(),calories:kcal,protein:pro,time:new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})})});toast('บันทึกอาหารแล้ว');return}
    if(f.id==='weight-form'){const w=Number(v.weight);if(!/^\d{4}-\d{2}-\d{2}$/.test(v.date)||!Number.isFinite(w)||w<20||w>350){toast('กรุณาตรวจสอบวันและน้ำหนัก','error');return}data.weights[v.date]=w;selected=v.date;save();render();toast('บันทึกน้ำหนักแล้ว');return}
    if(f.id==='add-task'){if(!v.task.trim())return;mutateDay(selected,d=>{d.custom.push({id:uid(),name:v.task.trim().slice(0,90)})});return}
    if(f.id==='save-note'){mutateDay(selected,d=>{d.note=String(v.note||'').slice(0,2500)});toast('บันทึกโน้ตแล้ว');return}
    if(f.id==='settings-form'){const s={...data.settings};for(const k of ['startWeight','goalWeight','calorieGoal','proteinGoal','waterGoal'])s[k]=Number(v[k]);s.startDate=v.startDate;if(!Object.values(s).every(x=>x!==''&&x!=null)||!/^\d{4}-\d{2}-\d{2}$/.test(s.startDate)||!(s.startWeight>=25&&s.startWeight<=350&&s.goalWeight>=25&&s.goalWeight<=350&&s.calorieGoal>=1200&&s.proteinGoal>=30&&s.waterGoal>=250)){toast('กรุณาตรวจสอบเป้าหมาย','error');return}data.settings=s;save();showSettings=false;render();toast('อัปเดตเป้าหมายแล้ว');return}
  });
  function exportData(){const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forma-backup-${localISO()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ส่งออกไฟล์สำรองแล้ว')}
  document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5*1024*1024)throw new Error('ไฟล์ใหญ่เกินไป');const parsed=JSON.parse(await file.text());if(parsed.version!==1||!parsed.settings||!parsed.days||!parsed.weights||typeof parsed.days!=='object'||typeof parsed.weights!=='object'||Array.isArray(parsed.days)||Array.isArray(parsed.weights)||!Number.isFinite(Number(parsed.settings.startWeight))||!Number.isFinite(Number(parsed.settings.goalWeight)))throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');if(!confirm('นำเข้าข้อมูลจากไฟล์นี้และแทนที่ข้อมูลปัจจุบันทั้งหมด?\nแนะนำให้ส่งออกไฟล์สำรองก่อน'))return;data=normalize(parsed);save();selected=localISO();showSettings=false;render();toast('นำเข้าข้อมูลสำเร็จ')}catch(err){toast('นำเข้าไม่สำเร็จ: '+err.message,'error')}finally{e.target.value=''}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&showSettings){showSettings=false;settingsModal()}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  render();
  </script>
</body>
